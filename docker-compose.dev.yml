version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: mini_ecommerce_dev_db
    environment:
      POSTGRES_DB: mini_ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mini_ecommerce"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ecommerce-dev-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mini_ecommerce_dev_backend
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: mini_ecommerce
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: dev_jwt_secret_mini_ecommerce
      CLIENT_URL: http://localhost:5173
    ports:
      - "5000:5000"
    volumes:
      - ./backend/src:/app/src
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ecommerce-dev-network

networks:
  ecommerce-dev-network:
    driver: bridge

volumes:
  postgres_dev_data:
    driver: local
